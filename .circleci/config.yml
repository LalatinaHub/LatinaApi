version: 2
jobs:
  build:
    working_directory: /latinaapi
    docker:
      - image: docker:17.05.0-ce-git
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Install dependencies
          command: |
            apk add --no-cache \
              py-pip=9.0.0-r1
            pip install \
              docker-compose==1.12.0 \
              awscli==1.11.76
      - run:
          name: Build application Docker image
          command: |
            docker build . -t ${CONTAINER_ENDPOINT}/latinaapi:main
      - deploy:
          name: Push application Docker image
          command: |
            if [ "${CIRCLE_BRANCH}" == "main" ]; then
              docker login $CONTAINER -u $DOCKER_USER -p $DOCKER_PASS
              docker push ${CONTAINER_ENDPOINT}/latinaapi:main
            fi

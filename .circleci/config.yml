version: 2
jobs:
  build:
    working_directory: /latinaapi
    docker:
      - image: docker:17.05.0-ce-git
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Install dependencies
          command: |
            apk add --no-cache \
              py-pip=9.0.0-r1
            pip install \
              docker-compose==1.12.0 \
              awscli==1.11.76
      - restore_cache:
          keys:
            - v1-{{ .Branch }}
          paths:
            - /caches/latinaapi.tar
      - run:
          name: Load Docker image layer cache
          command: |
            set +o pipefail
            docker load -i /caches/latinaapi.tar | true
      - run:
          name: Build application Docker image
          command: |
            docker build --cache-from=latinaapi -t ${CONTAINER_ENDPOINT}/latinaapi:main
      - run:
          name: Save Docker image layer cache
          command: |
            mkdir -p /caches
            docker save -o /caches/latinaapi.tar latinaapi
      - save_cache:
          key: v1-{{ .Branch }}-{{ epoch }}
          paths:
            - /caches/latinaapi.tar
      - deploy:
          name: Push application Docker image
          command: |
            if [ "${CIRCLE_BRANCH}" == "main" ]; then
              echo "$GITHUB_TOKEN" | docker login -u "dickymuliafiqri" --password-stdin
              docker push "${CONTAINER_ENDPOINT}/app:main"
            fi
